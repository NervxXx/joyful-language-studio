services:
  postgresql:
    image: postgres:16-alpine
    container_name: english_studio_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-english_studio}
      POSTGRES_USER: ${DB_USER:-english_studio_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "54321:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init_postgresql.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-english_studio_user} -d ${DB_NAME:-english_studio}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - english_studio_network

  redis:
    image: redis:7-alpine
    container_name: english_studio_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - english_studio_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: english_studio_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-english_studio_user}:${DB_PASSWORD}@postgresql:5432/${DB_NAME:-english_studio}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - english_studio_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: english_studio_frontend
    restart: unless-stopped
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - english_studio_network


volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  english_studio_network:
    driver: bridge
